version: '3.8'

services:
  mysql_agendamentos:
    image: mysql:8.0
    container_name: mysql_agendamentos
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword_ag
      MYSQL_DATABASE: agendamentos_db
      MYSQL_USER: agend_user
      MYSQL_PASSWORD: agend_pass
    ports:
      - "3307:3306"
    volumes:
      - mysql_agendamentos_data:/var/lib/mysql
    networks:
      - hospital-net

  mysql_clinica:
    image: mysql:8.0
    container_name: mysql_clinica
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword_cl
      MYSQL_DATABASE: clinica_db
      MYSQL_USER: clin_user
      MYSQL_PASSWORD: clin_pass
    ports:
      - "3308:3306"
    volumes:
      - mysql_clinica_data:/var/lib/mysql
    networks:
      - hospital-net

  mysql_cirurgico:
    image: mysql:8.0
    container_name: mysql_cirurgico
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword_cg
      MYSQL_DATABASE: cirurgico_db
      MYSQL_USER: ciru_user
      MYSQL_PASSWORD: ciru_pass
    ports:
      - "3309:3306"
    volumes:
      - mysql_cirurgico_data:/var/lib/mysql
    networks:
      - hospital-net

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"   
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - hospital-net

  keycloak:
    image: quay.io/keycloak/keycloak:21.1.1
    container_name: keycloak
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    command: start-dev --import-realm
    ports:
      - "8081:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./keycloak:/opt/keycloak/data/import
        - ./keycloak/themes:/opt/keycloak/themes
    networks:
      - hospital-net

  agendamentos_api:
    build:
      context: ..
      dockerfile: src/Agendamentos/Agendamentos.API/Dockerfile
    container_name: agendamentos_api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__AgendamentosDb=Server=mysql_agendamentos;Port=3306;Database=agendamentos_db;User=agend_user;Password=agend_pass;
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Port=5672
      - RabbitMQ__User=guest
      - RabbitMQ__Password=guest
      - Authentication__Authority=http://keycloak:8080/realms/hospital
      - Authentication__Audience=hospital-api
      - Authentication__RequireHttpsMetadata=false
      - ExternalApis__ClinicaBaseUrl=http://clinica_api:8080
      - ExternalApis__CirurgicoBaseUrl=http://cirurgico_api:8080
      - DisableHttpsRedirection=true
    depends_on:
      - mysql_agendamentos
      - rabbitmq
      - keycloak
    ports:
      - "7264:8080"
    networks:
      - hospital-net

  clinica_api:
    build:
      context: ..
      dockerfile: src/Clinica/Clinica.API/Dockerfile
    container_name: clinica_api
    environment:
      - ConnectionStrings__ClinicaDb=Server=mysql_clinica;Port=3306;Database=clinica_db;User=clin_user;Password=clin_pass;
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Port=5672
      - RabbitMQ__User=guest
      - RabbitMQ__Password=guest
      - Authentication__Authority=http://keycloak:8080/realms/hospital
      - Authentication__Audience=hospital-api
      - Authentication__RequireHttpsMetadata=false
      - ExternalApis__CirurgicoBaseUrl=http://cirurgico_api:8080
      - DisableHttpsRedirection=true
    depends_on:
      - mysql_clinica
      - rabbitmq
      - keycloak
    ports:
      - "7265:8080"
    networks:
      - hospital-net

  cirurgico_api:
    build:
      context: ..
      dockerfile: src/Cirurgico/Cirurgico.API/Dockerfile
    container_name: cirurgico_api
    environment:
      - ConnectionStrings__CirurgicoDb=Server=mysql_cirurgico;Port=3306;Database=cirurgico_db;User=ciru_user;Password=ciru_pass;
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Port=5672
      - RabbitMQ__User=guest
      - RabbitMQ__Password=guest
      - Authentication__Authority=http://keycloak:8080/realms/hospital
      - Authentication__Audience=hospital-api
      - Authentication__RequireHttpsMetadata=false
      - DisableHttpsRedirection=true
    depends_on:
      - mysql_cirurgico
      - rabbitmq
      - keycloak
    ports:
      - "7108:8080"
    networks:
      - hospital-net

  frontend:
    build:
      context: ../Gerenciamento-Hospiltar_Frontend
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "3000:80"
    networks:
      - hospital-net
  
  api_gateway:
    build:
      context: ..
      dockerfile: src/api-gateway/Dockerfile
    container_name: api_gateway
    environment:
      - Authentication__Authority=http://keycloak:8080/realms/hospital
      - Authentication__Audience=hospital-api
      - Authentication__RequireHttpsMetadata=false
      - ReverseProxy__Clusters__agendamentos-cluster__Destinations__d1__Address=http://agendamentos_api:8080/
      - ReverseProxy__Clusters__clinica-cluster__Destinations__d1__Address=http://clinica_api:8080/
      - ReverseProxy__Clusters__cirurgico-cluster__Destinations__d1__Address=http://cirurgico_api:8080/
      - DisableHttpsRedirection=true
    depends_on:
      - agendamentos_api
      - clinica_api
      - cirurgico_api
    ports:
      - "8085:8080"
    networks:
      - hospital-net

networks:
  hospital-net:

volumes:
  mysql_agendamentos_data:
  mysql_clinica_data:
  mysql_cirurgico_data:
  rabbitmq_data:
  keycloak_data:
  
