
@if(currentUser(); as user) {
<div class="space-y-6">
    <div>
        <h1 class="text-3xl font-bold">Olá, {{user.name}}!</h1>
        <p class="text-gray-600 mt-1">Bem-vindo ao seu painel de {{user.role}}.</p>
    </div>

    <div class="bg-blue-100 border-l-4 border-blue-500 text-blue-700 p-4 rounded-md" role="alert">
        <p class="font-bold">Seu Painel</p>
        <p>{{ welcomeMessage() }}</p>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <div class="bg-white p-6 rounded-lg shadow-md flex items-center space-x-4">
            <div class="bg-blue-500 p-3 rounded-full text-white">
                <ion-icon name="calendar-outline" class="text-2xl"></ion-icon>
            </div>
            <div>
                <p class="text-gray-500 text-sm">Próximo Agendamento</p>
                <p class="text-xl font-semibold">10/08/2024 - 10:00</p>
            </div>
        </div>
        <div class="bg-white p-6 rounded-lg shadow-md flex items-center space-x-4">
            <div class="bg-green-500 p-3 rounded-full text-white">
                <ion-icon name="medkit-outline" class="text-2xl"></ion-icon>
            </div>
            <div>
                <p class="text-gray-500 text-sm">Total de Consultas</p>
                <p class="text-xl font-semibold">5</p>
            </div>
        </div>
        <div class="bg-white p-6 rounded-lg shadow-md flex items-center space-x-4">
            <div class="bg-yellow-500 p-3 rounded-full text-white">
                <ion-icon name="flask-outline" class="text-2xl"></ion-icon>
            </div>
            <div>
                <p class="text-gray-500 text-sm">Exames Pendentes</p>
                <p class="text-xl font-semibold">2</p>
            </div>
        </div>
    </div>
</div>
}
