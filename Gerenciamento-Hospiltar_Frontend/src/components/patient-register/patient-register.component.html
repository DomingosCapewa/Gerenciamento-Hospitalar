<div class="max-w-2xl mx-auto py-12 px-6">
  <div class="bg-white rounded-lg shadow-md p-8">
    <h1 class="text-3xl font-bold mb-2">Completar Registro - Paciente</h1>
    <p class="text-gray-600 mb-8">Preencha seus dados para finalizar o cadastro como paciente.</p>

    <form (ngSubmit)="onSubmit()">
      <div class="space-y-6">
        <div class="grid grid-cols-1 gap-y-6 gap-x-4 sm:grid-cols-6">
          <div class="sm:col-span-3">
            <label for="nome" class="block text-sm font-medium text-gray-700">Nome *</label>
            <input 
              type="text" 
              id="nome" 
              name="nome"
              [(ngModel)]="form.nome" 
              required 
              class="mt-1 block w-full rounded-md border border-gray-300 shadow-sm px-3 py-2 focus:border-blue-500 focus:ring-blue-500">
          </div>
          <div class="sm:col-span-3">
            <label for="cpf" class="block text-sm font-medium text-gray-700">CPF *</label>
            <input 
              type="text" 
              id="cpf" 
              name="cpf"
              [(ngModel)]="form.cpf" 
              required 
              placeholder="00000000000"
              class="mt-1 block w-full rounded-md border border-gray-300 shadow-sm px-3 py-2 focus:border-blue-500 focus:ring-blue-500">
          </div>
          <div class="sm:col-span-2">
            <label for="idade" class="block text-sm font-medium text-gray-700">Idade</label>
            <input 
              type="number" 
              id="idade" 
              name="idade"
              [(ngModel)]="form.idade" 
              class="mt-1 block w-full rounded-md border border-gray-300 shadow-sm px-3 py-2 focus:border-blue-500 focus:ring-blue-500">
          </div>
          <div class="sm:col-span-2">
            <label for="sexo" class="block text-sm font-medium text-gray-700">Sexo</label>
            <select 
              id="sexo" 
              name="sexo" 
              [(ngModel)]="form.sexo"
              class="mt-1 block w-full rounded-md border border-gray-300 shadow-sm px-3 py-2 focus:border-blue-500 focus:ring-blue-500">
              <option>Masculino</option>
              <option>Feminino</option>
              <option>Outro</option>
            </select>
          </div>
          <div class="sm:col-span-2">
            <label for="dataNascimento" class="block text-sm font-medium text-gray-700">Data de Nascimento</label>
            <input 
              type="date" 
              id="dataNascimento" 
              name="dataNascimento"
              [(ngModel)]="form.dataNascimento"
              class="mt-1 block w-full rounded-md border border-gray-300 shadow-sm px-3 py-2 focus:border-blue-500 focus:ring-blue-500">
          </div>
          <div class="sm:col-span-3">
            <label for="telefone" class="block text-sm font-medium text-gray-700">Telefone</label>
            <input 
              type="tel" 
              id="telefone" 
              name="telefone"
              [(ngModel)]="form.telefone"
              placeholder="(11) 99999-9999"
              class="mt-1 block w-full rounded-md border border-gray-300 shadow-sm px-3 py-2 focus:border-blue-500 focus:ring-blue-500">
          </div>
          <div class="sm:col-span-3">
            <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
            <input 
              type="email" 
              id="email" 
              name="email"
              [(ngModel)]="form.email"
              class="mt-1 block w-full rounded-md border border-gray-300 shadow-sm px-3 py-2 focus:border-blue-500 focus:ring-blue-500">
          </div>
        </div>
      </div>

      <div class="pt-6 flex justify-end gap-4">
        <a href="/#/dashboard" class="px-6 py-2 rounded-md border border-gray-300 text-gray-700 font-medium hover:bg-gray-50">
          Cancelar
        </a>
        <button 
          type="submit" 
          [disabled]="isLoading()"
          class="px-6 py-2 rounded-md bg-blue-600 text-white font-medium hover:bg-blue-700 disabled:bg-gray-400 disabled:cursor-not-allowed">
          @if(isLoading()) {
            <span class="flex items-center gap-2">
              <svg class="animate-spin h-5 w-5" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
              </svg>
              Registrando...
            </span>
          } @else {
            Registrar Paciente
          }
        </button>
      </div>
    </form>
  </div>
</div>
