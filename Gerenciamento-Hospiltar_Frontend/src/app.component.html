
<app-notification></app-notification>

@if (isLoggedIn()) {
  <div class="flex h-screen bg-gray-100">
    <!-- Sidebar -->
    <aside class="w-64 flex-shrink-0 bg-gray-800 text-white flex flex-col">
      <div class="h-16 flex items-center justify-center px-4 bg-gray-900">
        <h1 class="text-xl font-semibold">HMS</h1>
      </div>
      <nav class="flex-1 px-2 py-4 space-y-1">
        @for(item of navigation(); track item.name) {
          <a
            [routerLink]="item.href"
            routerLinkActive="bg-gray-700 text-white"
            [routerLinkActiveOptions]="{exact: true}"
            class="flex items-center px-2 py-2 text-sm font-medium rounded-md hover:bg-gray-700 hover:text-white"
          >
            <ion-icon [name]="item.icon" class="mr-3 text-lg"></ion-icon>
            {{ item.name }}
          </a>
        }
      </nav>
      <div class="px-2 py-4 border-t border-gray-700">
         @if(currentUser(); as user) {
            <div class="px-2 py-2">
                <p class="text-sm font-medium">{{ user.name }}</p>
                <p class="text-xs text-gray-400">{{ user.role }}</p>
            </div>
         }
        <button (click)="logout()" class="w-full flex items-center px-2 py-2 text-sm font-medium rounded-md text-red-300 hover:bg-red-500 hover:text-white">
            <ion-icon name="log-out-outline" class="mr-3 text-lg"></ion-icon>
            Sair
        </button>
      </div>
    </aside>

    <!-- Main content -->
    <main class="flex-1 overflow-y-auto p-8">
      <router-outlet></router-outlet>
    </main>
  </div>
} @else {
  <router-outlet></router-outlet>
}
